<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>For You 💖</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: radial-gradient(circle, #0a0015, #000);
    font-family: Arial, sans-serif;
}

/* Texto central */
#text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 40px;
    color: #ff9de2;
    text-shadow: 
        0 0 10px #ff69b4,
        0 0 30px #ff00ff;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.1); }
    100% { transform: translate(-50%, -50%) scale(1); }
}
</style>
</head>

<body>

<div id="text">I love you babe 💕</div>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let flowers = [];
let aleRays = [];

const cx = () => canvas.width / 2;
const cy = () => canvas.height / 2;

// 🌸 Flores en espiral
for (let i = 0; i < 100; i++) {
    flowers.push({
        angle: Math.random() * Math.PI * 2,
        radius: Math.random() * 400 + 50,
        speed: 0.01 + Math.random() * 0.01,
        size: 10 + Math.random() * 10,
        color: `hsl(${Math.random()*360}, 80%, 70%)`
    });
}

// ⚡ Crear rayos "Ale"
function createAle() {
    return {
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        vx: (Math.random() - 0.5) * 10,
        vy: (Math.random() - 0.5) * 10,
        life: 60,
        trail: []
    };
}

// Generar varios
for (let i = 0; i < 10; i++) {
    aleRays.push(createAle());
}

// 🌸 Dibujar flor
function drawFlower(x, y, size, color) {
    for (let i = 0; i < 5; i++) {
        let a = i * (Math.PI * 2 / 5);
        let px = x + Math.cos(a) * size;
        let py = y + Math.sin(a) * size;

        ctx.beginPath();
        ctx.arc(px, py, size/2, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
    }

    ctx.beginPath();
    ctx.arc(x, y, size/3, 0, Math.PI * 2);
    ctx.fillStyle = "#fff";
    ctx.fill();
}

// 🎬 Animación
function animate() {
    ctx.fillStyle = "rgba(0,0,0,0.25)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 🌪️ Flores
    flowers.forEach(f => {
        f.angle += f.speed;
        f.radius -= 0.3;

        if (f.radius < 20) {
            f.radius = 400;
            f.angle = Math.random() * Math.PI * 2;
        }

        let x = cx() + Math.cos(f.angle) * f.radius;
        let y = cy() + Math.sin(f.angle) * f.radius;

        drawFlower(x, y, f.size, f.color);
    });

    // ⚡ Animación "Ale"
    aleRays.forEach((a, i) => {
        a.x += a.vx;
        a.y += a.vy;
        a.life--;

        a.trail.push({x: a.x, y: a.y});
        if (a.trail.length > 10) a.trail.shift();

        // Dibujar rastro
        ctx.beginPath();
        for (let j = 0; j < a.trail.length - 1; j++) {
            ctx.moveTo(a.trail[j].x, a.trail[j].y);
            ctx.lineTo(a.trail[j+1].x, a.trail[j+1].y);
        }

        ctx.strokeStyle = "rgba(255,0,255,0.6)";
        ctx.lineWidth = 2;
        ctx.shadowBlur = 15;
        ctx.shadowColor = "#ff00ff";
        ctx.stroke();

        // Dibujar texto
        ctx.fillStyle = "#ffb6ff";
        ctx.font = "16px Arial";
        ctx.fillText("Ale", a.x, a.y);

        // Reiniciar
        if (a.life <= 0) {
            aleRays[i] = createAle();
        }
    });

    requestAnimationFrame(animate);
}

animate();

// Responsive
window.addEventListener("resize", () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
</script>

</body>
</html>
